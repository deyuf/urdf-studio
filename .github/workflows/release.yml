name: Release pipeline

# Branch pushes run the full test suite. main automatically publishes stable;
# develop and design/quiet-studio publish beta. Tags never retrigger this workflow.
# Both channels publish the exact VSIX tested in the real VS Code instance.
# Annotated release tags preserve source/version checkpoints for safe reruns.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Stable increment (auto: patch, or promote above the beta line)'
        type: choice
        options: [auto, minor, major]
        default: auto

# Cancel in-progress runs for the same PR; never cancel main runs (they ship).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_PROJECT: urdf-studio

jobs:
  prepare:
    name: Plan release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      RELEASE_CHANNEL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'stable' || github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/design/quiet-studio') && 'beta' || 'none' }}
      RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
      RELEASE_PLAN_PATH: /tmp/urdf-release/release-plan.json
      MARKETPLACE_PATH: /tmp/urdf-release-marketplace.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read published Marketplace versions
        if: env.RELEASE_CHANNEL != 'none'
        run: npx --yes @vscode/vsce@^3.9.1 show deyuf.urdf-studio --json > "$MARKETPLACE_PATH"
      - name: Plan or resume release
        id: plan
        run: |
          mkdir -p /tmp/urdf-release
          node scripts/release.cjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          overwrite: true
          path: ${{ env.RELEASE_PLAN_PATH }}
          retention-days: 7

  # =================================================================
  # test — runs on every branch push and every PR.
  # Uploads the production web build as an artifact so the downstream
  # deploy jobs don't have to rebuild.
  # =================================================================
  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Record source dependency hash before versioning
        id: lockfile
        run: echo "hash=${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - name: Apply planned version to both manifests
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.lockfile.outputs.hash }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build production VS Code extension
        run: npm run package

      - name: Build web bundle (incl. docs)
        run: npm run web:build

      - name: Playwright (renderer + web shell)
        run: npx playwright test

      - name: Package the candidate VSIX
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          args=()
          if [ "$RELEASE_CHANNEL" = beta ]; then args+=(--pre-release); fi
          npx --yes @vscode/vsce@^3.9.1 package "${args[@]}" \
            --githubBranch "$GITHUB_SHA" --out "$RUNNER_TEMP/release/urdf-studio-$RELEASE_VERSION.vsix"
          cp package.json package-lock.json "$RUNNER_TEMP/release/"
          cp "$RUNNER_TEMP/release-plan.json" "$RUNNER_TEMP/release/"

      # Real VS Code integration test: opens the Franka FR3 xacro with the
      # custom editor inside an actual VS Code instance and asserts the full
      # host↔webview handshake (ready → loadRobot → geometryLoaded). This is
      # the only tier that exercises VS Code's real webview message delivery —
      # two shipped regressions were invisible to every browser-based test.
      - name: Cache VS Code test build
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ steps.lockfile.outputs.hash }}

      - name: VS Code integration test (tested VSIX, load/save/restore/reload)
        env:
          URDF_STUDIO_VSIX: ${{ runner.temp }}/release/urdf-studio-${{ needs.prepare.outputs.version }}.vsix
          URDF_STUDIO_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        # Explicit screen args: the stock xvfb-run default (640x480) is too
        # small/shallow for Electron's compositor — the webview renderer
        # process never paints and the handshake never starts.
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" node test/integration/run.cjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          overwrite: true
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Upload tested release bundle
        if: needs.prepare.outputs.channel != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          overwrite: true
          path: ${{ runner.temp }}/release
          retention-days: 7

      # Hand the built web app to the deploy jobs. Only on main pushes /
      # manual dispatch — no point building artifacts for PR runs.
      - name: Upload web build artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          overwrite: true
          path: dist-web
          retention-days: 1

  # =================================================================
  # deploy-web — production deploy to Cloudflare Pages.
  # Only on main, only after tests pass. Uses the artifact built by
  # the test job so we don't rebuild.
  # =================================================================
  deploy-web:
    name: Deploy web app to Cloudflare Pages
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Verify Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN"  ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            cat <<EOF >&2
          ::error::Missing required secrets: ${missing[*]}

          Configure them under Settings → Secrets and variables → Actions.

          To get them:
            1. Account ID — visible in any Cloudflare dashboard page (right sidebar).
            2. API Token — https://dash.cloudflare.com/profile/api-tokens
                 → Create Token → Custom → grant:
                     Account · Cloudflare Pages · Edit
                     User    · User Details     · Read
                 → constrain to your account → Continue → Create.

          See docs/development/deployment.md for the full walk-through.
          EOF
            exit 1
          fi
          echo "Secrets present (token=${#CLOUDFLARE_API_TOKEN} chars, account=${#CLOUDFLARE_ACCOUNT_ID} chars)."

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist-web

      - name: Verify build output
        run: |
          test -f dist-web/index.html || { echo "::error::dist-web/index.html missing"; exit 1; }
          test -f dist-web/app.js     || { echo "::error::dist-web/app.js missing";     exit 1; }
          test -d dist-web/docs       || { echo "::error::dist-web/docs missing";       exit 1; }
          du -sh dist-web

      # Use the Cloudflare REST API directly rather than parsing wrangler's
      # pretty-printed table — that breaks across wrangler minor versions and
      # was the source of an earlier "process npx failed with exit code 1"
      # failure mode.
      - name: Ensure Cloudflare Pages project exists
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          http=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "${api}/${PAGES_PROJECT}")
          case "$http" in
            200)
              echo "Pages project '${PAGES_PROJECT}' already exists."
              ;;
            404)
              echo "Pages project not found; creating '${PAGES_PROJECT}'..."
              create_http=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                -X POST \
                -d "{\"name\":\"${PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
                "${api}")
              if [ "$create_http" != "200" ] && [ "$create_http" != "201" ]; then
                echo "::error::Project create returned HTTP ${create_http}"
                cat /tmp/create.json
                exit 1
              fi
              ;;
            401|403)
              echo "::error::Cloudflare API rejected the token (HTTP ${http}). Check that CLOUDFLARE_API_TOKEN has 'Cloudflare Pages: Edit' on this account."
              cat /tmp/project.json
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${http} from Cloudflare API"
              cat /tmp/project.json
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=${{ env.PAGES_PROJECT }} --branch=main

  # =================================================================
  # preview-web — non-production Cloudflare Pages deploy for any branch
  # push that isn't main and isn't a tag. Deploys under the branch alias
  # so the URL is <branch>.urdf-studio.pages.dev and Cloudflare treats it
  # as a preview environment (not the production main branch). Skipped
  # for PR builds — those already get covered by the manual
  # preview-web.yml workflow, and double-deploying would just burn quota.
  # =================================================================
  preview-web:
    name: Preview deploy (branch → Cloudflare Pages preview)
    needs: test
    if: >-
      github.ref != 'refs/heads/main'
      && github.event_name == 'push'
      && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build web bundle
        run: npm run web:build

      - name: Resolve preview branch alias
        id: alias
        run: |
          alias='${{ github.ref_name }}'
          # Cloudflare Pages branch aliases must match [a-z0-9-]; squash
          # other chars and trim leading/trailing dashes.
          alias=$(echo "$alias" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//;s/-$//')
          # Cloudflare branch field cannot exceed 28 chars and must NOT
          # equal the production branch name.
          alias=${alias:0:28}
          if [ "$alias" = "main" ]; then
            alias="branch-main"
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview alias for ${{ github.ref_name }} → ${alias}.urdf-studio.pages.dev"

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.alias.outputs.alias }}

      - name: Summarize preview URL
        run: |
          echo "### Web preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\` → \`${{ steps.alias.outputs.alias }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://${{ steps.alias.outputs.alias }}.${{ env.PAGES_PROJECT }}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a **preview** environment, not production. The main app at urdf.deyuf.org is only updated when changes land on \`main\`." >> "$GITHUB_STEP_SUMMARY"

  # The publication job has no build step: it uses the tested artifact.
  # Both Marketplace channels share a lock; stale plans fail before publishing.
  publish:
    name: Publish tested ${{ needs.prepare.outputs.channel }} release
    needs: [prepare, test]
    if: needs.prepare.outputs.channel != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: marketplace-urdf-studio
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ARTIFACT_DIR: /tmp/urdf-release
      RELEASE_PLAN_PATH: /tmp/urdf-release/release-plan.json
      MARKETPLACE_PATH: /tmp/urdf-release-marketplace.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
      - name: Verify publishing credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT" || { echo '::error::VSCE_PAT is required'; exit 1; }
      - name: Save immutable source and version checkpoint
        run: node scripts/release.cjs checkpoint
      - name: Refresh Marketplace state
        run: npx --yes @vscode/vsce@^3.9.1 show deyuf.urdf-studio --json > "$MARKETPLACE_PATH"
      - name: Check whether publication is still needed
        id: verify
        run: node scripts/release.cjs verify
      - name: Publish the tested VSIX
        if: steps.verify.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          args=()
          if [ "$RELEASE_CHANNEL" = beta ]; then args+=(--pre-release); fi
          npx --yes @vscode/vsce@^3.9.1 publish "${args[@]}" \
            --packagePath "$RELEASE_ARTIFACT_DIR/urdf-studio-$RELEASE_VERSION.vsix"
      - name: Create or complete GitHub Release
        if: env.RELEASE_CHANNEL == 'stable'
        run: |
          vsix="$RELEASE_ARTIFACT_DIR/urdf-studio-$RELEASE_VERSION.vsix"
          if gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/github-release.json"; then
            if ! node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); process.exit(r.assets.some(a=>a.name===process.argv[2])?0:1)' \
              "$RUNNER_TEMP/github-release.json" "urdf-studio-$RELEASE_VERSION.vsix"; then
              gh release upload "$RELEASE_TAG" "$vsix"
            fi
          else
            echo "Source commit: $GITHUB_SHA. This VSIX passed the full CI suite before publication." > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" "$vsix" --verify-tag --title "$RELEASE_TAG" \
              --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Summarize release
        run: |
          echo "Released $RELEASE_CHANNEL **$RELEASE_VERSION** from $GITHUB_SHA ($RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"

  # =================================================================
  # deploy-docs — GitHub Pages.
  # Only runs after BOTH deploy-web and publish complete successfully.
  # Reuses the test job's web-build artifact.
  # =================================================================
  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: [deploy-web, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist-web

      - name: Verify docs output
        run: |
          test -f dist-web/docs/index.html || { echo "::error::dist-web/docs/index.html missing"; exit 1; }
          ls -la dist-web/docs | head

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages on the very first run. The enablement API
          # technically requires `administration: write`, which GITHUB_TOKEN
          # cannot be granted (only fine-grained PATs can — and 'administration'
          # is rejected as a workflow-permission key, see GitHub Actions
          # schema). The action degrades gracefully: if enablement is denied,
          # it falls back to the existing-site lookup and emits a clear "Not
          # Found" error. In that case, do the one-time toggle by hand:
          #   Settings → Pages → Build and deployment → Source: GitHub Actions
          # Subsequent runs no-op since Pages is already enabled.
          enablement: true

      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ship only the docs subtree — the app itself lives on Cloudflare.
          path: dist-web/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
